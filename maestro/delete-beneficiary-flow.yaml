appId: com.skaleetfrontendtechnicaltest
---
# Delete flow: the confirmation alert gates deletion — Cancel keeps the
# beneficiary, the alert's Delete button removes it.
- launchApp:
    clearState: true
- tapOn: 'Beneficiaries'
- tapOn: 'Add Beneficiary'
- tapOn: 'First name'
- inputText: 'John'
- hideKeyboard
- tapOn: 'Last name'
- inputText: 'Doe'
- hideKeyboard
- tapOn: 'IBAN'
- inputText: 'GB29 NWBK 6016 1331 9268 19'
- hideKeyboard
- tapOn: 'Save Beneficiary'
- assertVisible: 'John Doe'
- tapOn: 'Delete'
- assertVisible: 'Remove John Doe from your beneficiaries?'
- tapOn: 'Cancel'
- assertVisible: 'John Doe'
- tapOn: 'Delete'
# While the alert is open only the dialog is in the hierarchy, so this
# taps the alert's confirm button (rendered uppercase by Android).
- tapOn: 'Delete'
- assertVisible: 'No beneficiaries yet'
