appId: com.skaleetfrontendtechnicaltest
---
# Smoke flow: create a beneficiary, make a transaction with them, restart
# the app, and verify the state persisted (balance + history).
- launchApp:
    clearState: true
# Cold starts on the emulator are slow (bundle fetch + storage init):
# give the first screen up to 60s to appear before interacting.
- extendedWaitUntil:
    visible:
      id: 'home-add-transaction'
    timeout: 60000
- tapOn:
    id: 'tab-beneficiaries'
- tapOn:
    id: 'add-beneficiary'
- tapOn: 'First name'
- inputText: 'John'
- hideKeyboard
- tapOn: 'Last name'
- inputText: 'Doe'
- hideKeyboard
- tapOn: 'IBAN'
- inputText: 'GB29 NWBK 6016 1331 9268 19'
- hideKeyboard
- tapOn: 'Save Beneficiary'
- assertVisible: 'GB29 NWBK 6016 1331 9268 19'
- tapOn:
    id: 'tab-home'
- tapOn:
    id: 'home-add-transaction'
- tapOn: '0.00'
- inputText: '10.50'
- hideKeyboard
# The beneficiary just created is the recipient chips' default selection.
- tapOn: 'Submit Transaction'
- assertVisible: '€989.50'
- assertVisible: '-€10.50'
- assertVisible: 'John Doe'
- stopApp
- launchApp
- assertVisible: '€989.50'
- assertVisible: 'John Doe'
