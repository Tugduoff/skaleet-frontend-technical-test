appId: com.skaleetfrontendtechnicaltest
---
# Reset flow: make a transaction, then reset the demo data. The confirmation
# alert gates it — Cancel keeps the state, Reset restores the initial state.
- launchApp:
    clearState: true
- tapOn: 'Add Transaction'
- tapOn: 'Enter amount'
- inputText: '10'
- hideKeyboard
- tapOn: 'Recipient Name'
- inputText: 'John Doe'
- hideKeyboard
- tapOn: 'Recipient IBAN'
- inputText: 'GB29 NWBK 6016 1331 9268 19'
- hideKeyboard
- tapOn: 'Submit Transaction'
# Decline saving the recipient; back on Home with the transaction applied.
- tapOn: 'No thanks'
- assertVisible: 'Current Balance: $990.00'
- tapOn: 'Reset demo data'
- assertVisible: 'Restore the initial balance and clear all transactions and beneficiaries?'
- tapOn: 'Cancel'
- assertVisible: 'Current Balance: $990.00'
- tapOn: 'Reset demo data'
# While the alert is open only the dialog is in the hierarchy.
- tapOn: 'Reset'
- assertVisible: 'Current Balance: $1000.00'
- assertVisible: 'No transactions yet'
