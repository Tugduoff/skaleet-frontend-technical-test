appId: com.skaleetfrontendtechnicaltest
---
# Edit flow: create a beneficiary, rename it, and verify the list updates.
- launchApp:
    clearState: true
# Cold starts on the emulator are slow (bundle fetch + storage init):
# give the first screen up to 60s to appear before interacting.
- extendedWaitUntil:
    visible:
      id: 'home-add-transaction'
    timeout: 60000
- tapOn:
    id: 'tab-beneficiaries'
- tapOn:
    id: 'add-beneficiary'
- tapOn: 'First name'
- inputText: 'John'
- hideKeyboard
- tapOn: 'Last name'
- inputText: 'Doe'
- hideKeyboard
- tapOn: 'IBAN'
- inputText: 'GB29 NWBK 6016 1331 9268 19'
- hideKeyboard
- tapOn: 'Save Beneficiary'
- assertVisible: 'John Doe'
- tapOn:
    id: 'beneficiary-edit-1'
# The form is prefilled, so fields are matched by their current value.
- tapOn: 'Doe'
- eraseText
- inputText: 'Smith'
- hideKeyboard
- tapOn: 'Save Beneficiary'
- assertVisible: 'John Smith'
- assertNotVisible: 'John Doe'
