appId: com.skaleetfrontendtechnicaltest
---
# Save-recipient flow: a manual transaction to an unknown IBAN offers to
# save the recipient. Declining keeps the list empty; accepting opens the
# prefilled beneficiary form.
- launchApp:
    clearState: true
# Cold starts on the emulator are slow (bundle fetch + storage init):
# give the first screen up to 60s to appear before interacting.
- extendedWaitUntil:
    visible:
      id: 'home-add-transaction'
    timeout: 60000
- tapOn:
    id: 'home-add-transaction'
- tapOn: '0.00'
- inputText: '10'
- hideKeyboard
- tapOn: 'Recipient Name'
- inputText: 'John Doe'
- hideKeyboard
- tapOn: 'Recipient IBAN'
- inputText: 'GB29 NWBK 6016 1331 9268 19'
- hideKeyboard
- tapOn: 'Submit Transaction'
- assertVisible: 'Add John Doe to your beneficiaries?'
- tapOn: 'No thanks'
- assertVisible: '€990.00'
- tapOn:
    id: 'tab-beneficiaries'
- assertVisible: 'No beneficiaries yet'
- tapOn:
    id: 'tab-home'
- tapOn:
    id: 'home-add-transaction'
- tapOn: '0.00'
- inputText: '10'
- hideKeyboard
- tapOn: 'Recipient Name'
- inputText: 'John Doe'
- hideKeyboard
- tapOn: 'Recipient IBAN'
- inputText: 'GB29 NWBK 6016 1331 9268 19'
- hideKeyboard
- tapOn: 'Submit Transaction'
- tapOn: 'Save'
# The prefilled form opens; saving it lands back on Home.
- tapOn: 'Save Beneficiary'
- tapOn:
    id: 'tab-beneficiaries'
- assertVisible: 'John Doe'
- assertVisible: 'GB29 NWBK 6016 1331 9268 19'
