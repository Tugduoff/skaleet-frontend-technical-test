name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref: no credits burned on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prettier
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci --coverage
      # Non-blocking until #20 (RN upgrade): current advisories live inside
      # react-native's own dependency tree (Metro/Babel/ws/shell-quote) —
      # build-time tooling, not code shipped in the app.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
